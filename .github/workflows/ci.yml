name: CI

on:
  push:
    branches: [main, ci-zh]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release --arch arm64
      - name: Self-test
        run: "$(swift build -c release --arch arm64 --show-bin-path)/removemacai selftest"
      - name: App bundle
        run: tools/build-app.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoveMacAI-zh-CN
          path: .build/RemoveMacAI.app
